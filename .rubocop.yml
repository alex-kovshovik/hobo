inherit_from: .rubocop_todo.yml

require:
  - ./lib/rubocop/shovik.rb

plugins:
  - rubocop-rails

AllCops:
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
    - 'script/**/*'
    - 'bin/**/*'
    - 'config.ru'
  SuggestExtensions: false
  NewCops: enable

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 150

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Rails:
  Enabled: false

Rails/Date:
  Enabled: true

Rails/TimeZone:
  Enabled: true

Shovik/TestsPinClock:
  Enabled: true
  Include:
    - 'test/**/*_test.rb'
    - 'spec/**/*_spec.rb'
  PinningHelpers: []

Shovik/RescueRequiresLibrary:
  Enabled: true
  Libraries:
    'Net::': ['net/protocol', 'net/http', 'net/https', 'net/smtp', 'net/imap', 'net/pop', 'net/ftp']
    'Net::HTTP': ['net/http', 'net/https']
    'Net::SMTP': ['net/smtp']
    'Net::IMAP': ['net/imap']
    'Net::POP': ['net/pop']
    'Net::FTP': ['net/ftp']
    'OpenSSL::': ['openssl', 'net/https']
    'JSON::': ['json']
    'Zlib::': ['zlib']
    'CSV::': ['csv']
    'IPAddr::': ['ipaddr']
    'Resolv::': ['resolv']
